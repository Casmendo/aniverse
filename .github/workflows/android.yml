name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://api.aniiverse.name.ng

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Create Dummy Web Assets
        run: |
          cd frontend
          mkdir -p out
          echo "<html><body>AniVerse Mobile Shell</body></html>" > out/index.html

      - name: Capacitor Sync
        run: |
          cd frontend
          npx cap sync android

      - name: Build with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniVerse-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: AniVerse APK - Build ${{ github.run_number }}
          body: |
            🚀 New AniVerse APK build — automatically generated from the latest commit.
            Download `app-debug.apk` below to install on your Android device.
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
